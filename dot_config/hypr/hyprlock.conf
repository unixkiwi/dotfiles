auth {
  pam {
    enabled = true
  }
}

animations {
  enabled = true
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) 

    outer_color = rgba(ffffffff)
    check_color=rgba(ffffffff)
    fail_color=rgba(ffaaaaff)

    font_color = rgb(143, 143, 143)
    fade_on_empty = true
    rounding = 15

    position = 0, -20
    halign = center
    valign = center
}
