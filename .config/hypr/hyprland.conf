################
### MONITORS ###
################

# monitor=eDP-1, disable # disable internal display
# monitor=,highres,auto,1.6 # set tv 4k with 1.6 fractional scaling

source = ~/.config/hypr/monitor.conf

#################
### Variables ###
#################

$terminal = alacritty 
$fileManager = nautilus
$menu = pkill wofi || wofi --show drun

#################
### AUTOSTART ###
#################

exec-once = hyprctl setcursor Bibata-Original-Classic 24
exec-once = systemctl --user start hyprpolkitagent # polkit
exec-once = waybar & # Bar
exec-once = swaybg --image ~/Pictures/astronaut_wall_gruvbox.png --mode fill # Wallpaper
exec-once = swaync & # Notifications
exec-once = blueman-applet & # Bluetooth
exec-once = nm-applet & # Network
exec-once = wl-paste --type text --watch cliphist store # Clipboard text data
exec-once = wl-paste --type image --watch cliphist store # Clipboard image data
exec-once = signal-desktop --start-in-tray --no-sandbox # start signal in tray
exec-once = udiskie -tnc &

# install xdg-desktop-portal-gtk
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark" # set dark mode for gtk4
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Graphite-Dark' # set gtk theme

#############################
### ENVIRONMENT VARIABLES ###
#############################

# cursor
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# backend display theme stuff
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = GDK_SCALE,2
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# electron is bad stuff
# make vscode work
env = ELECTRON_OZONE_PLATFORM_HINT,wayland 

# nvidia stuff
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LIBVA_DRIVER_NAME,nvidia

################
### XWAYLAND ###
################

xwayland {
    force_zero_scaling = true
}

#####################
### LOOK AND FEEL ###
#####################

general { 
    gaps_in = 5
    gaps_out = 7

    border_size = 0

    col.active_border = rgb(aaaaaa)
    col.inactive_border = rgba(545454aa)

    resize_on_border = false

    # just for gaming
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 7

    active_opacity = 1.0
    inactive_opacity = 0.7

    shadow {
        enabled = true
        range = 10
        render_power = 10
        color = rgba(ffffff20)
        color_inactive = rgba(00000000)
    }
    

    blur {
        enabled = true
        size = 5
        passes = 2
        ignore_opacity = true
        new_optimizations = true
        vibrancy = 0.1696
    }
}

animations {
    enabled = true

    # bezier = myBezier, 0.05, 0.9, 0.1, 1.1

    animation = windows, 1, 7, default, 
    animation = windowsOut, 1, 5, default, slide
    animation = border, 1, 3, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 9, default
    animation = specialWorkspace, 1, 7, default, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc { 
    force_default_wallpaper = 0
    disable_hyprland_logo = false
}

#############
### INPUT ###
#############

input {
    kb_layout = de
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gestures {
    workspace_swipe = false
}

####################
### KEYBINDINGSS ###
####################

$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, F, fullscreen,1
bind = $mainMod SHIFT, F, fullscreen,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, SUPER_L, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, H, togglesplit, # dwindle

# btop
bind = $mainMod, B, exec, alacritty --class floating -e btop

# Reload
bind = $mainMod SHIFT, R, exec, killall waybar; waybar &
bind = $mainMod, R, exec, hyprctl reload

# Notifications
bind = $mainMod, N, exec, swaync-client -t -sw

# Clipboard
bind = $mainMod SHIFT, V, exec, killall wofi; cliphist list | wofi --show dmenu --height 450 --width 350 --x $(hyprctl cursorpos | awk '{print $1}' | tr -d ',') --y $(hyprctl cursorpos | awk '{print $2-25}') --config ~/.config/wofi/clipboard_config | cliphist decode | wl-copy

# Volume
binde =, XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
binde =, XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%- 
bind =, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle 

bind = $mainMod, G, exec, ~/.config/hypr/scripts/game_mode.sh

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move window
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d 

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = float, class:floating
