[general]
import = [
    "~/.config/alacritty/themes/themes/base16_default_dark.toml"
]



[font.bold]
family = "CaskaydiaCove Nerd Font Mono"
style = "bold"

[font.glyph_offset]
x = 0
y = 0

[font.italic]
family = "CaskaydiaCove Nerd Font Mono"

[font.normal]
family = "CaskaydiaCove Nerd Font Mono"
style = "Regular"

[font.offset]
x = 0
y = 0

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 500
thickness = 0.2
